name: KMP Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Build only (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile Android target
        run: ./gradlew :composeApp:compileAndroidMain -PbuildProfile=ci -PbuildTarget=Android

      - name: Assemble Android target
        run: ./gradlew :composeApp:assembleAndroidMain -PbuildProfile=ci -PbuildTarget=Android

  common:
    name: Code Quality (Testing)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin metadata
        run: ./gradlew :composeApp:compileKotlinMetadata -PbuildProfile=ci -PbuildTarget=metadata

      - name: Compile host-safe unit tests
        run: ./gradlew :composeApp:assembleUnitTest -PbuildProfile=ci -PbuildTarget=tests

  ios:
    name: Build only (iOS)
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile iOS simulator
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 -PbuildProfile=ci -PbuildTarget=iOS-simulator

      - name: Run iOS simulator tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test -PbuildProfile=ci -PbuildTarget=iOS-simulator-tests
