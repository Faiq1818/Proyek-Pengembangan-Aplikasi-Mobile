name: Release Dry Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dry-run version name, for example 0.0.0-dry-run
        required: false
        default: 0.0.0-dry-run
        type: string
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dry-build.yml"
      - "androidApp/**"
      - "composeApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  dry-release:
    name: Dry build Android APK and iOS
    runs-on: macos-latest

    env:
      DRY_VERSION: ${{ github.event.inputs.version || '0.0.0-dry-run' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin metadata
        run: ./gradlew :composeApp:compileKotlinMetadata -PbuildProfile=release -PbuildTarget=metadata -Papp.versionName=${DRY_VERSION}

      - name: Compile host-safe unit tests
        run: ./gradlew :composeApp:assembleUnitTest -PbuildProfile=release -PbuildTarget=tests -Papp.versionName=${DRY_VERSION}

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleRelease -PbuildProfile=release -PbuildTarget=Android -Papp.versionName=${DRY_VERSION}

      - name: Build iOS simulator artifact
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 -PbuildProfile=release -PbuildTarget=iOS-simulator -Papp.versionName=${DRY_VERSION}

      - name: Collect dry-build artifacts
        shell: bash
        run: |
          mkdir -p release-dry-artifacts/android release-dry-artifacts/ios
          find androidApp/build/outputs/apk -type f -name "*.apk" -print -exec cp {} release-dry-artifacts/android/ \; || true
          find composeApp/build -type f \( -name "*.klib" -o -name "*.framework.zip" \) -print -exec cp {} release-dry-artifacts/ios/ \; || true
          tar -czf mybawanggacha-${DRY_VERSION}-dry-build-artifacts.tar.gz release-dry-artifacts

      - name: Upload dry-build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mybawanggacha-${{ env.DRY_VERSION }}-dry-build-artifacts
          path: mybawanggacha-${{ env.DRY_VERSION }}-dry-build-artifacts.tar.gz
          if-no-files-found: error
